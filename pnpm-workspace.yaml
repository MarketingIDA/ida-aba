# Cooldown de 7 dias (em minutos): versão publicada há menos que isso não é instalada, nem como
# dependência transitiva. Protege contra pacote malicioso publicado e retirado em poucos dias.
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
# Scripts de instalação desligados: só roda o que estiver aqui como `true`.
# unrs-resolver: o binário nativo vem do pacote opcional da plataforma; o postinstall é só fallback.
allowBuilds:
  unrs-resolver: false
# eslint-plugin-jsx-a11y 6.10.2 declara peer até o ESLint 9, mas as regras funcionam no 10.
# Revisar quando sair uma versão com peer 10.
peerDependencyRules:
  allowedVersions:
    eslint-plugin-jsx-a11y>eslint: '10'
