# CI: qualidade (lint, tipos, testes com cobertura, build) → E2E em celular e desktop → segurança.
# Cada job bloqueia o merge; o job `resultado` reúne todos e é o único check que uma regra de
# proteção da main precisa exigir. Actions pinadas por SHA (o comentário diz a versão);
# permissões mínimas.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: '0'
  # Valores de teste, sem segredo: o app valida as variáveis públicas no boot.
  VITE_SUPABASE_URL: https://exemplo.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_teste

jobs:
  qualidade:
    name: Qualidade (lint, tipos, testes, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build

  e2e:
    name: E2E (${{ matrix.projeto }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        projeto: [mobile, desktop]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --project=${{ matrix.projeto }}
        env:
          CI: 'true'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: e2e-${{ matrix.projeto }}
          path: test-results
          retention-days: 7

  seguranca:
    name: Segurança (segredos, SAST, dependências)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # O gitleaks lista os commits do PR pela API: precisa ler pull requests.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Semgrep (OWASP Top 10, React, TypeScript)
        if: ${{ !cancelled() }}
        run: |
          python -m pip install --disable-pip-version-check semgrep==1.184.0
          semgrep scan --metrics=off --error \
            --config p/owasp-top-ten --config p/react --config p/typescript \
            src tests supabase/functions
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: ${{ !cancelled() }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ !cancelled() }}
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Lockfile congelado e auditoria de dependências
        if: ${{ !cancelled() }}
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --audit-level=high

  resultado:
    name: Resultado
    if: ${{ always() }}
    needs: [qualidade, e2e, seguranca]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Todos os jobs passaram
        env:
          RESULTADOS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Resultados: $RESULTADOS"
          for r in $RESULTADOS; do
            if [ "$r" != "success" ]; then exit 1; fi
          done
